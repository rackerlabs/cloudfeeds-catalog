name: Catalog Release and Deploy Pipeline

on:
  push:
    branches:
      - test-release
      - staging
      - 'feature/**'
      - main
  workflow_dispatch:
    inputs:
      schema_version:
        description: 'Schema version (passed by schema pipeline)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - test
          - staging
          - prod

env:
  ECR_REGISTRY: 583275065488.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: catalog

jobs:
  # ============================================================
  # JOB 1: Check if this is a Maven release plugin commit
  # If yes — skip everything
  # ============================================================
  check-commit:
    name: Check Commit Message
    runs-on: self-hosted
    outputs:
      skip: ${{ steps.check.outputs.SKIP }}
    steps:
    - name: Check if Maven release commit
      id: check
      run: |
        MSG="${{ github.event.head_commit.message }}"
        if [[ "${MSG}" == *"[maven-release-plugin]"* ]]; then
          echo "SKIP=true" >> $GITHUB_OUTPUT
          echo "Skipping — Maven release plugin commit"
        else
          echo "SKIP=false" >> $GITHUB_OUTPUT
          echo "Proceeding — normal commit"
        fi

  # ============================================================
  # JOB 2: Release JAR
  # Runs ONLY on push to test-release, skips Maven commits
  # ============================================================
  release:
    name: Release Catalog JAR to GitHub Packages
    runs-on: self-hosted
    needs: [check-commit]
    if: |
      needs.check-commit.outputs.skip == 'false' &&
      github.event_name == 'push' &&
      github.ref_name == 'test-release'
    outputs:
      catalog_version: ${{ steps.get-version.outputs.VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}

    - name: Configure Maven settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <settings>
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${{ secrets.GH_TOKEN }}</password>
            </server>
            <server>
              <id>releases.maven.research.rackspace.com</id>
              <username>cloudfeeds-cicd</username>
              <password>${{ secrets.RACKSPACE_MAVEN_PASSWORD }}</password>
            </server>
            <server>
              <id>central</id>
              <username>cf-artifact-cicd-svc</username>
              <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
            </server>
            <server>
              <id>snapshots</id>
              <username>cf-artifact-cicd-svc</username>
              <password>${{ secrets.ARTIFACTORY_PASSWORD }}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Configure git
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git config --global credential.helper store
        echo "https://${{ github.actor }}:${{ secrets.GH_TOKEN }}@github.com" \
          > ~/.git-credentials

    - name: Clean up any previous failed release
      run: |
        rm -f release.properties pom.xml.releaseBackup
        CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        RELEASE=$(echo $CURRENT | sed 's/-SNAPSHOT//')
        TAG="feedscatalog-${RELEASE}"
        if git tag | grep -q "^${TAG}$"; then
          echo "Deleting existing tag: ${TAG}"
          git tag -d ${TAG}
          git push origin :refs/tags/${TAG} || true
        else
          echo "No existing tag found for ${TAG}"
        fi

    - name: Run Maven Release
      run: |
        CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        RELEASE=$(echo $CURRENT | sed 's/-SNAPSHOT//')
        NEXT=$(echo $RELEASE | awk -F. '{print $1"."$2"."$3+1}')
        mvn -B -up -P build-app-rpm -Dresume=false \
            release:prepare release:perform \
            -DdryRun=false \
            -DreleaseVersion=${RELEASE} \
            -DdevelopmentVersion=${NEXT}-SNAPSHOT

    - name: Get released version
      id: get-version
      run: |
        VERSION=$(git describe --tags --abbrev=0 | sed 's/feedscatalog-//')
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Released catalog version: ${VERSION}"

  # ============================================================
  # JOB 3: Set environment based on branch or workflow_dispatch
  # ============================================================
  set-env:
    name: Set Deployment Environment
    runs-on: self-hosted
    needs: [check-commit, release]
    if: |
      always() && !cancelled() &&
      needs.check-commit.outputs.skip == 'false' &&
      needs.release.result != 'failure'
    outputs:
      environment:     ${{ steps.detect.outputs.ENV }}
      ecs_cluster:     ${{ steps.detect.outputs.ECS_CLUSTER }}
      ecs_service:     ${{ steps.detect.outputs.ECS_SERVICE }}
      ecs_task_def:    ${{ steps.detect.outputs.ECS_TASK_DEF }}
      container_name:  ${{ steps.detect.outputs.CONTAINER_NAME }}
      aws_profile:     ${{ steps.detect.outputs.AWS_PROFILE }}
      tag_prefix:      ${{ steps.detect.outputs.TAG_PREFIX }}
      catalog_version: ${{ steps.detect.outputs.CATALOG_VERSION }}
      schema_version:  ${{ steps.detect.outputs.SCHEMA_VERSION }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect environment
      id: detect
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          ENV="prod"
        elif [[ "${{ github.ref_name }}" == "staging" || \
                "${{ github.ref_name }}" == feature/* ]]; then
          ENV="staging"
        else
          ENV="test"
        fi

        echo "ENV=${ENV}" >> $GITHUB_OUTPUT

        if [[ "${ENV}" == "prod" ]]; then
          echo "ECS_CLUSTER=prod-cloudfeeds-ecs-cluster"   >> $GITHUB_OUTPUT
          echo "ECS_SERVICE=prod-prod-catalog"             >> $GITHUB_OUTPUT
          echo "ECS_TASK_DEF=prod-prod-catalog"            >> $GITHUB_OUTPUT
          echo "CONTAINER_NAME=prod-catalog"               >> $GITHUB_OUTPUT
          echo "AWS_PROFILE=feeds"                         >> $GITHUB_OUTPUT
          echo "TAG_PREFIX=prod"                           >> $GITHUB_OUTPUT
        elif [[ "${ENV}" == "staging" ]]; then
          echo "ECS_CLUSTER=staging-staging-cloudfeeds-ecs-cluster" >> $GITHUB_OUTPUT
          echo "ECS_SERVICE=staging-staging-catalog"                >> $GITHUB_OUTPUT
          echo "ECS_TASK_DEF=staging-staging-catalog"               >> $GITHUB_OUTPUT
          echo "CONTAINER_NAME=staging-catalog"                     >> $GITHUB_OUTPUT
          echo "AWS_PROFILE=staging"                                >> $GITHUB_OUTPUT
          echo "TAG_PREFIX=staging"                                 >> $GITHUB_OUTPUT
        else
          echo "ECS_CLUSTER=abdu7511-test-cloudfeeds-ecs-cluster"   >> $GITHUB_OUTPUT
          echo "ECS_SERVICE=test-abdu7511-catalog"                  >> $GITHUB_OUTPUT
          echo "ECS_TASK_DEF=test-abdu7511-catalog"                 >> $GITHUB_OUTPUT
          echo "CONTAINER_NAME=abdu7511-catalog"                    >> $GITHUB_OUTPUT
          echo "AWS_PROFILE=test"                                   >> $GITHUB_OUTPUT
          echo "TAG_PREFIX=test"                                    >> $GITHUB_OUTPUT
        fi

        # Schema version
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "SCHEMA_VERSION=${{ github.event.inputs.schema_version }}" >> $GITHUB_OUTPUT
        else
          SCHEMA=$(mvn help:evaluate \
            -Dexpression=usage-schema.version -q -DforceStdout 2>/dev/null \
            || echo "1.139.5")
          echo "SCHEMA_VERSION=${SCHEMA}" >> $GITHUB_OUTPUT
        fi

        # Catalog version
        if [[ -n "${{ needs.release.outputs.catalog_version }}" ]]; then
          echo "CATALOG_VERSION=${{ needs.release.outputs.catalog_version }}" >> $GITHUB_OUTPUT
        else
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null \
            | sed 's/feedscatalog-//' || echo "1.138.7")
          echo "CATALOG_VERSION=${VERSION}" >> $GITHUB_OUTPUT
        fi

  # ============================================================
  # JOB 4: Build Docker Image and Deploy to ECS
  # ============================================================
  deploy:
    name: Deploy Catalog to ${{ needs.set-env.outputs.environment }}
    runs-on: self-hosted
    needs: [set-env]
    if: always() && !cancelled() && needs.set-env.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Display parameters
      run: |
        echo "Trigger:         ${{ github.event_name }}"
        echo "Environment:     ${{ needs.set-env.outputs.environment }}"
        echo "Catalog Version: ${{ needs.set-env.outputs.catalog_version }}"
        echo "Schema Version:  ${{ needs.set-env.outputs.schema_version }}"
        echo "ECS Service:     ${{ needs.set-env.outputs.ecs_service }}"
        echo "Container:       ${{ needs.set-env.outputs.container_name }}"

    - name: Log in to Amazon ECR
      run: |
        aws ecr get-login-password --region us-east-2 --profile tf_user | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

    - name: Build Docker image
      run: |
        IMAGE_TAG="${{ needs.set-env.outputs.tag_prefix }}-$(date +%Y%m%d%H%M%S)"
        NEW_IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
        echo "NEW_IMAGE_URI=${NEW_IMAGE_URI}" >> $GITHUB_ENV

        docker build \
          --build-arg SCHEMA_VERSION=${{ needs.set-env.outputs.schema_version }} \
          --build-arg CATALOG_VERSION=${{ needs.set-env.outputs.catalog_version }} \
          --build-arg GITHUB_ACTOR=${{ github.actor }} \
          --build-arg TOKEN=${{ secrets.GH_TOKEN }} \
          -f docker/Dockerfile \
          -t catalog:${IMAGE_TAG} .

        docker tag catalog:${IMAGE_TAG} ${NEW_IMAGE_URI}
        echo "Built: ${NEW_IMAGE_URI}"

    - name: Push to ECR
      run: docker push ${{ env.NEW_IMAGE_URI }}

    - name: Update ECS — main container only
      run: |
        export AWS_PROFILE=${{ needs.set-env.outputs.aws_profile }}
        CONTAINER="${{ needs.set-env.outputs.container_name }}"
        NEW_IMAGE="${{ env.NEW_IMAGE_URI }}"

        aws ecs describe-task-definition \
          --task-definition ${{ needs.set-env.outputs.ecs_task_def }} \
          --query 'taskDefinition | {containerDefinitions: containerDefinitions, family: family, taskRoleArn: taskRoleArn, executionRoleArn: executionRoleArn, networkMode: networkMode, volumes: volumes, placementConstraints: placementConstraints, requiresCompatibilities: requiresCompatibilities, cpu: cpu, memory: memory}' \
          --output json > task-def.json

        jq --arg name "$CONTAINER" --arg image "$NEW_IMAGE" \
           '.containerDefinitions = [.containerDefinitions[] |
             if .name == $name then .image = $image else . end
           ]' task-def.json > task-def-updated.json

        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://task-def-updated.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        rm -f task-def.json task-def-updated.json

        aws ecs update-service \
          --cluster ${{ needs.set-env.outputs.ecs_cluster }} \
          --service ${{ needs.set-env.outputs.ecs_service }} \
          --task-definition "${NEW_TASK_DEF_ARN}" --region us-east-2

        echo "Deployed: ${NEW_TASK_DEF_ARN}"

    - name: Summary
      run: |
        echo "## Catalog → ${{ needs.set-env.outputs.environment }}"               >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}"                             >> $GITHUB_STEP_SUMMARY
        echo "- **Catalog Version**: ${{ needs.set-env.outputs.catalog_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Schema Version**: ${{ needs.set-env.outputs.schema_version }}"   >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ env.NEW_IMAGE_URI }}"                               >> $GITHUB_STEP_SUMMARY
        echo "- **ECS Service**: ${{ needs.set-env.outputs.ecs_service }}"         >> $GITHUB_STEP_SUMMARY
