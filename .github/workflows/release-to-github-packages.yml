name: Catalog - Release to GitHub Packages

on:
  push:
    branches: [ 'CF-test-ci/cd' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalog version to release'
        required: true
        type: string

jobs:
  release:
    name: Release Catalog JAR to GitHub Packages
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release version
      id: release-version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ inputs.version }}"
          echo "Using manual version: ${VERSION}"
          mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Using tag version: ${VERSION}"
          mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
        else
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Using pom.xml version: ${VERSION}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Releasing Catalog version: ${VERSION}"

    - name: Build and test
      run: |
        echo "Building and testing Catalog ${{ steps.release-version.outputs.VERSION }}"
        mvn clean test -B

    - name: Deploy to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        echo "Deploying Catalog JAR to GitHub Packages"
        echo "Version: ${{ steps.release-version.outputs.VERSION }}"
        echo "Actor: ${GITHUB_ACTOR}"
        echo ""
        echo "Using existing Maven settings from ~/.m2/settings.xml"
        echo "Using existing Java installation on runner"
        echo ""

        # Deploy using exact command pattern you use today
        mvn -up -P build-app-rpm deploy -DskipTests -B

        echo ""
        echo "Catalog WAR deployed to GitHub Packages"
        echo "Package: com.rackspace.feeds:feedscatalog:${{ steps.release-version.outputs.VERSION }}"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Catalog v${{ steps.release-version.outputs.VERSION }}
        body: |
          ## Catalog Release ${{ steps.release-version.outputs.VERSION }}

          ### WAR Published to GitHub Packages
          - `feedscatalog-${{ steps.release-version.outputs.VERSION }}.war`

          ### Maven Dependency
          ```xml
          <dependency>
              <groupId>com.rackspace.feeds</groupId>
              <artifactId>feedscatalog</artifactId>
              <version>${{ steps.release-version.outputs.VERSION }}</version>
              <type>war</type>
          </dependency>
          ```

          ###  Next Steps
          This release only publishes the WAR to GitHub Packages.

          **To deploy to ECS:**
          1. Go to Actions  "Catalog - Build and Deploy to ECS"
          2. Click "Run workflow"
          3. Leave versions empty (uses latest)
          4. Select environment: test/staging/prod
          5. Click "Run workflow"
        draft: false
        prerelease: false

    - name: Summary
      run: |
        echo "##Catalog WAR Released" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: \`${{ steps.release-version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Published to**: GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "**Package**: \`com.rackspace.feeds:feedscatalog\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "###Artifacts Published:" >> $GITHUB_STEP_SUMMARY
        echo "- feedscatalog-${{ steps.release-version.outputs.VERSION }}.war" >> $GITHUB_STEP_SUMMARY
        echo "- feedscatalog-${{ steps.release-version.outputs.VERSION }}-app.rpm (if build-app-rpm profile used)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### To Deploy to ECS:" >> $GITHUB_STEP_SUMMARY
        echo "Go to Actions → **Catalog - Build and Deploy to ECS** → Run workflow" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Package URL:" >> $GITHUB_STEP_SUMMARY

