name: Docker Build and Deploy

on:
  push:
    branches:
      - CF-test-4258    #branch name which is used for image building

jobs:
  build:
    runs-on: self-hosted

    env:
      ECR_REPOSITORY: catalog
      AWS_REGION: us-east-1

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Set Short commit SHA as image tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: AWS ECR login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build docker image
        run: |
          docker build -f docker/Dockerfile -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push docker image to registry
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
